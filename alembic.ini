[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# B5: deliberately EMPTY. This line used to read `sqlite:///leads.db`, which made the
# repository's own database file the default target of a shell `alembic upgrade head`.
# `migrations/env.py` resolves the real target (DATABASE_URL, or DB_PATH for SQLite, or the
# URL that `core.schema_manager` pins for programmatic runs) and REFUSES to run when nothing
# named one, so a typo in the environment cannot silently migrate a file in the checkout.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
