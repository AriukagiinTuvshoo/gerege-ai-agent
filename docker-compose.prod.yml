version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gerege}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gerege_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gerege} -d ${POSTGRES_DB:-gerege_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ENV: production
      STRICT_SECURITY: "1"
      WEBHOOK_FAIL_CLOSED: "1"
      STRICT_QPAY_VERIFICATION: "1"
      DISABLE_INLINE_SCHEDULER: "1"
      # SEC-01/B-02: CORS allowlist is mandatory in production (no wildcard fallback).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required (e.g. https://app.example.mn)}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gerege}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gerege_crm}
      REDIS_URL: redis://redis:6379/0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # E-02 Phase 3: there is no reverse proxy in this topology, so nothing is trusted
      # and the default stays empty on purpose. `web` publishes port 8000 directly, so
      # every TCP peer is the real client. Set this ONLY when a fronting proxy is added,
      # and then list the proxy's addresses — never the clients'.
      # uvicorn runs with --no-proxy-headers (see Dockerfile), so this is the single
      # authority on forwarding.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # E-02 Phase 4.1: keyed-HMAC secret for account-level failed-login counters.
      # `compose` sets ENV=production (see the environment block above), so the app REFUSES
      # TO START if this is unset, blank or shorter than 32 characters. Required, not optional:
      # use ":?" so a missing value fails at `docker compose up` rather than at request time.
      # Quoted: the `:?` message contains punctuation YAML would otherwise misparse.
      E02_ACCOUNT_KEY_SECRET: ${E02_ACCOUNT_KEY_SECRET:?required, min 32 chars - see docs/deployment/PRODUCTION_DEPLOYMENT.md 1.2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - ./backups:/app/backups
      - ./static/qrcodes:/app/static/qrcodes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      ENV: production
      STRICT_SECURITY: "1"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gerege}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gerege_crm}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  pgdata:
  redisdata:
