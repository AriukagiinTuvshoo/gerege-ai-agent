version: "3.9"

# ---------------------------------------------------------------------------
# E-05: two credentials, two planes.
#
# `gerege_app`   runtime   -> web, worker. Owns nothing, no DDL, audit_logs is
#                             SELECT+INSERT only. This is the only DSN the
#                             application containers receive.
# `gerege_owner` maintenance -> migrate, maintenance. Runs Alembic, pg_dump and
#                             restore. Never mounted into web or worker.
#
# The bootstrap superuser (`POSTGRES_USER`) is used by the `db` container to create
# its own cluster and by `provision-roles` to create the two roles. It is not a
# runtime credential any more.
#
# Provisioning runs from `migrate` (which depends on nothing else) so a fresh stack
# comes up in one `docker compose up`: create roles -> migrate as owner -> start web.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gerege}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gerege_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gerege} -d ${POSTGRES_DB:-gerege_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # E-02 Phase 6, R11 + R14. The eviction policy and the memory cap are security settings
    # here, not tuning:
    #
    #   --maxmemory-policy noeviction  (Redis's default, now explicit)
    #     A rate-limit counter must never be evicted to make room for another one. Evicting a
    #     live counter silently hands that account a fresh budget — the same bug as the memory
    #     store's capacity handling, which refuses rather than displaces a live counter. Under
    #     pressure Redis refuses writes instead, the account limiter fails closed (R14), and
    #     readiness turns 503. That is the intended failure: loud and closed, not quiet and open.
    #     Do NOT switch to allkeys-lru "to avoid errors"; it converts this into a bypass.
    #
    #   --maxmemory 400mb
    #     Derived from measurement, not guessed. Two keys are written per admitted account
    #     (`ratelimit:auth_account:<digest>` and its lockout sibling), both with a TTL equal to
    #     the 900 s window. A measured 20,000-account fill (40,000 keys) used
    #     292.5 bytes/account = 5.6 MiB, so on logical `used_memory` 400mb holds roughly
    #     1.4 million concurrently-throttled accounts — far beyond any realistic login working
    #     set. (Phase 7 reported ~339 B/account; the difference is measurement conditions, not
    #     a regression. Both are recorded rather than silently reconciled.)
    #
    #     MEASURED: used_memory only. NOT measured: peak RSS under a real workload in this
    #     container, allocator behaviour across a fork/AOF-rewrite, and the actual cgroup limit
    #     at deploy time. `maxmemory` bounds logical memory, not RSS, and Redis can exceed
    #     maxmemory transiently while freeing. So "400mb fits in a 512M container" is an
    #     assumption with a thin margin, not a verified fact — see docs/audit §13.7.
    #
    #     ACTION REQUIRED before relying on this in production: confirm the deployment's
    #     container memory limit (status: UNVERIFIED in the audited environment — no container
    #     runtime was available to inspect), and keep at least ~25% headroom between
    #     maxmemory and that limit. With --appendonly yes, the AOF rewrite buffer and COW
    #     during a background rewrite add to RSS on top of used_memory.
    #
    # Review point: if the account-key namespace or per-account key count changes, re-measure
    # and re-derive this number. If the deployment approaches ~1M live counters in one window,
    # raise maxmemory and the container limit together.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "400mb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ENV: production
      STRICT_SECURITY: "1"
      WEBHOOK_FAIL_CLOSED: "1"
      STRICT_QPAY_VERIFICATION: "1"
      DISABLE_INLINE_SCHEDULER: "1"
      # SEC-01/B-02: CORS allowlist is mandatory in production (no wildcard fallback).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required (e.g. https://app.example.mn)}
      # E-05: the runtime credential. NOT the bootstrap `POSTGRES_USER`.
      # `POSTGRES_APP_PASSWORD` is required (`:?`) so a deployment cannot silently come up
      # with a blank password, and so the failure is at `compose up` rather than at login.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_APP_USER:-gerege_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@db:5432/${POSTGRES_DB:-gerege_crm}
      # The startup assertion is enforced by ENV=production alone; this makes the intent
      # explicit and keeps the check on even if ENV were ever relaxed.
      REQUIRE_LEAST_PRIVILEGE: "1"
      REDIS_URL: redis://redis:6379/0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # E-02 Phase 3: there is no reverse proxy in this topology, so nothing is trusted
      # and the default stays empty on purpose. `web` publishes port 8000 directly, so
      # every TCP peer is the real client. Set this ONLY when a fronting proxy is added,
      # and then list the proxy's addresses — never the clients'.
      # uvicorn runs with --no-proxy-headers (see Dockerfile), so this is the single
      # authority on forwarding.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # E-02 Phase 4.1: keyed-HMAC secret for account-level failed-login counters.
      # `compose` sets ENV=production (see the environment block above), so the app REFUSES
      # TO START if this is unset, blank or shorter than 32 characters. Required, not optional:
      # use ":?" so a missing value fails at `docker compose up` rather than at request time.
      # Quoted: the `:?` message contains punctuation YAML would otherwise misparse.
      E02_ACCOUNT_KEY_SECRET: ${E02_ACCOUNT_KEY_SECRET:?required, min 32 chars - see docs/deployment/PRODUCTION_DEPLOYMENT.md 1.2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - ./backups:/app/backups
      - ./static/qrcodes:/app/static/qrcodes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # E-05: roles must exist and be verified before the app connects. A failed
      # provisioning or a failed `--verify` now stops `web` from starting at all.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      ENV: production
      STRICT_SECURITY: "1"
      # E-05: same runtime credential as `web`. The worker never needs DDL —
      # `ensure_schema()` is a no-op at head and the tail of `init_db()` is data only.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_APP_USER:-gerege_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@db:5432/${POSTGRES_DB:-gerege_crm}
      REQUIRE_LEAST_PRIVILEGE: "1"
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # -------------------------------------------------------------------------
  # E-05: the owner plane. One-shot, no restart, no published port.
  #
  # `migrate` is the only service that holds `POSTGRES_OWNER_PASSWORD`, and it
  # does the whole bring-up in order: create/refresh the two roles, then migrate
  # as the owner. `web` and `worker` depend on it completing successfully, so an
  # over-privileged or missing role stops the stack at start-up rather than at the
  # first request.
  #
  # `depends_on` uses `service_completed_successfully`, so `docker compose up` on a
  # fresh volume provisions roles and migrates before anything serves traffic.
  # -------------------------------------------------------------------------
  migrate:
    build: .
    restart: "no"
    command:
      - "sh"
      - "-c"
      - >-
        python scripts/provision_roles.py --apply &&
        python -m alembic upgrade head &&
        python scripts/provision_roles.py --apply &&
        python scripts/provision_roles.py --verify
    environment:
      ENV: production
      # DSNs for the maintenance plane only. These are NOT passed to web/worker.
      # The provisioning steps read ADMIN_DATABASE_URL; `alembic upgrade head` reads
      # DATABASE_URL.
      #
      # Why `--apply` runs TWICE, and why both run as the bootstrap account:
      #
      #   pass 1 (before migration) creates the two roles. On a fresh volume there is
      #     nothing else to do — no tables exist yet.
      #   migration runs as the bootstrap account, which owns what it creates: 19 tables,
      #     13 sequences and the two audit trigger functions.
      #   pass 2 (after migration) is the one that matters on both fresh and existing
      #     volumes: it transfers ownership of everything to `gerege_owner` and applies
      #     the grants.
      #
      # `ALTER TABLE ... OWNER TO gerege_owner` requires the *current* user to be a member
      # of the new owner, so it cannot be done by `gerege_owner` over objects it does not
      # yet own. That is why this container holds the bootstrap credential, and why web
      # and worker never do.
      #
      # Both passes are idempotent; `--verify` runs last and fails the container if the
      # end state is wrong, which stops `web`/`worker` from starting.
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-gerege}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gerege_crm}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gerege}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gerege_crm}
      GEREGE_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      GEREGE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  # Operator-invoked or timer-invoked, never started by `up` (profile-scoped,
  # restart: "no"). This is the only service that holds the owner credential.
  #
  #   # manual
  #   docker compose -f docker-compose.prod.yml run --rm maintenance \
  #       python scripts/maintenance.py backup --label manual
  #   # what the scheduler runs (backup + encrypt + verify + retain + alert)
  #   docker compose -f docker-compose.prod.yml run --rm --no-deps maintenance \
  #       python scripts/maintenance.py backup-run --label scheduled
  #
  # Phase 16 (MEDIUM-02): `backup-run` needs the encryption key and, optionally, an
  # offsite target and an alert webhook. Encryption is ON by default and the run FAILS
  # CLOSED in production if no key is configured, rather than quietly writing plaintext
  # tenant data to the host. Set BACKUP_ENCRYPTION=off only in development.
  maintenance:
    build: .
    restart: "no"
    profiles: ["maintenance"]
    entrypoint: ["python", "scripts/maintenance.py"]
    environment:
      ENV: production
      DATABASE_OWNER_URL: postgresql://${POSTGRES_OWNER_USER:-gerege_owner}:${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}@db:5432/${POSTGRES_DB:-gerege_crm}
      BACKUP_ENCRYPTION: ${BACKUP_ENCRYPTION:-on}
      # The key is a FILE, never an env value. It must be mounted from the host at the
      # path below; the documentation (docs/operations/BACKUP_ENCRYPTION.md) names this
      # same path. Phase 17 found the docs telling operators to create
      # /etc/gerege/backup.key while Compose mounted ./secrets/backup.key, so following
      # the instructions produced a key the container never saw.
      BACKUP_ENCRYPTION_KEY_FILE: ${BACKUP_ENCRYPTION_KEY_FILE:-/run/secrets/backup.key}
      BACKUP_OFFSITE_PATH: ${BACKUP_OFFSITE_PATH:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-7}
      BACKUP_ALERT_WEBHOOK: ${BACKUP_ALERT_WEBHOOK:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-36}
    volumes:
      - ./backups:/app/backups
      # The key is mounted read-only from the host. It is a FILE, never an env value,
      # so it cannot leak through `docker inspect` or a process listing.
      - ./secrets/backup.key:/run/secrets/backup.key:ro
      # Offsite target. Phase 18: this used to default to `./backups`, i.e. the SAME
      # host directory already mounted at /app/backups, so a self-copy was reported as an
      # offsite backup. There is deliberately NO default mount now, because a default
      # that is silently the same disk is worse than none. To use a second device,
      # uncomment and point it somewhere real:
      #
      #   - /mnt/backup-disk:/mnt/offsite
      #
      # and set BACKUP_OFFSITE_PATH=/mnt/offsite. Preferred in production is object
      # storage: set BACKUP_OFFSITE_URL (https), BACKUP_OFFSITE_ACCESS_KEY,
      # BACKUP_OFFSITE_SECRET_KEY and BACKUP_OFFSITE_REGION, which needs no mount at
      # all. With nothing configured the run reports OFFSITE: NOT CONFIGURED.
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
