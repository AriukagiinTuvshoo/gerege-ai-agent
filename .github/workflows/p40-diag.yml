name: P40 diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gerege
          POSTGRES_PASSWORD: ci_pg_password_2026
          POSTGRES_DB: gerege_crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U gerege" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          pip install -q -r requirements.txt
      - name: provision
        run: |
          set -euo pipefail
          export PGPASSWORD="ci_pg_password_2026"
          psql -h 127.0.0.1 -U gerege -d postgres -q \
            -c "ALTER ROLE gerege_owner LOGIN PASSWORD 'ci_pg_password_2026'" 2>&1 || true
          psql -h 127.0.0.1 -U gerege -d postgres -tAc "select 1 from pg_roles where rolname='gerege_owner'" || true
      - name: run the step and print everything
        run: |
          set -uo pipefail
          export PGPASSWORD="ci_pg_password_2026"
          psql -h 127.0.0.1 -U gerege -d postgres -c "DROP DATABASE IF EXISTS gerege_p24_dr" -c "CREATE DATABASE gerege_p24_dr OWNER gerege_owner"
          DATABASE_URL="postgresql+psycopg2://gerege_owner:ci_pg_password_2026@127.0.0.1:5432/gerege_p24_dr" \
          DATABASE_OWNER_URL="postgresql+psycopg2://gerege_owner:ci_pg_password_2026@127.0.0.1:5432/gerege_p24_dr" \
            alembic upgrade head
          psql -h 127.0.0.1 -U gerege -d gerege_p24_dr -c "INSERT INTO pages (page_id,name) VALUES ('p24_dr_seed','x') ON CONFLICT DO NOTHING"
          env P24_DR_DATABASE_URL="postgresql://gerege_owner:ci_pg_password_2026@127.0.0.1:5432/gerege_p24_dr" \
              DATABASE_URL="postgresql+psycopg2://gerege_owner:ci_pg_password_2026@127.0.0.1:5432/gerege_p24_dr" \
              DATABASE_OWNER_URL="postgresql+psycopg2://gerege_owner:ci_pg_password_2026@127.0.0.1:5432/gerege_p24_dr" \
            pytest tests/test_e07_phase22_alerting.py tests/test_e07_phase22_backup_policy.py \
              tests/test_e07_phase22_offsite_integrity.py tests/test_e07_phase22_aead_binding.py \
              tests/test_e07_phase22_connection_bounds.py tests/test_e07_phase22_db_bounds.py \
              tests/test_e07_phase22_offsite_pagination.py tests/test_e07_phase22_offsite_status.py \
              tests/test_e07_phase22_recovery_safety.py tests/test_e07_phase22_retention_plaintext.py \
              tests/test_e07_phase22_wal_copy_safety.py tests/test_e07_phase23_alert_redaction.py \
              tests/test_e07_phase23_exit_codes.py tests/test_e07_phase23_restore_verification.py \
              tests/test_e07_phase24_disaster_recovery.py tests/test_e07_phase24_offsite_integration.py \
              -v --tb=short -p no:cacheprovider > /tmp/out.log 2>&1 || true
          echo "=== summary"; tail -3 /tmp/out.log
          echo "=== every FAILED/ERROR"; grep -E "^(FAILED|ERROR)" /tmp/out.log || echo none
          echo "=== every SKIPPED"; grep "SKIPPED" /tmp/out.log | sed 's/ SKIPPED.*//' | sort
