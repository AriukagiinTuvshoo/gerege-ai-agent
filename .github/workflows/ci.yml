          # confirm the assertion refuses it. Without this, a broken check reads as green.
          # CLEANUP of a previous run. `DROP OWNED` is per-database, so a leftover grant
          # in another database still blocks DROP ROLE; `REASSIGN OWNED` + `DROP OWNED` in
          # each database is the documented sequence, and the drop must not be allowed to
          # abort the gate before it has done any work.
          for _db in ("postgres",):
              try:
                  _c = psycopg2.connect(_norm(base) + "/" + _db)
                  _c.autocommit = True
                  _k = _c.cursor()
                  _k.execute("DROP OWNED BY e05_control_owner")
                  _k.close()
                  _c.close()
              except Exception:
                  pass
          try:
              cur.execute("DROP OWNED BY e05_control_owner")
          except Exception:
              pass
          cur.execute("DROP ROLE IF EXISTS e05_control_owner")
          cur.execute("CREATE ROLE e05_control_owner LOGIN PASSWORD 'control_pw_2026' NOINHERIT")
          cur.execute("GRANT e05_control_owner TO gerege")
          cur.execute("GRANT USAGE ON SCHEMA public TO e05_control_owner")
          cur.execute("GRANT SELECT ON ALL TABLES IN SCHEMA public TO e05_control_owner")
          cur.execute("ALTER TABLE audit_logs OWNER TO e05_control_owner")

          ctl_dsn = (_norm(base) + "/" + DB.rsplit("/", 1)[1]).replace(
              "gerege:ci_pg_password_2026@", "e05_control_owner:control_pw_2026@"
          )
          control = psycopg2.connect(ctl_dsn)
          try:
              report = db_privileges.collect_runtime_privileges(control)
          finally:
              control.close()
          violations = db_privileges.evaluate_runtime_privileges(report)
          if not any("owns" in v for v in violations):
              sys.exit("::error::negative control failed: a table owner was not flagged")
          print("Phase 14: negative control confirmed — a table owner is refused.")

          # ...and the app role is accepted by the same evaluator, so the control proves
          # discrimination rather than blanket rejection.
          app_conn = psycopg2.connect(ctl_dsn.replace(
              "e05_control_owner:control_pw_2026", "gerege_app:ci_app_pw_2026"))
          try:
              app_report = db_privileges.collect_runtime_privileges(app_conn)
          finally:
              app_conn.close()
          if db_privileges.evaluate_runtime_privileges(app_report):
              sys.exit("::error::gerege_app is not least-privileged: "
                       + "; ".join(db_privileges.evaluate_runtime_privileges(app_report)))
          print("Phase 14: gerege_app accepted by the same check that refuses an owner.")

          # Restore ownership BEFORE dropping the control role. `DROP OWNED BY <role>`
          # does not just revoke privileges: it DROPS every object that role owns. The
          # negative control deliberately makes it own `audit_logs`, so skipping this
          # line deletes the audit table from the test database (observed: alembic still
          # reported 0007 while `audit_logs` was gone, which is a nasty state to debug).
          cur.execute("ALTER TABLE audit_logs OWNER TO gerege_owner")
          cur.execute("DROP OWNED BY e05_control_owner")
          cur.execute("DROP ROLE IF EXISTS e05_control_owner")

          # Prove the table survived the whole exercise, rather than reporting success
          # from a database the negative control had already damaged.
          cur.execute("SELECT to_regclass('public.audit_logs') IS NOT NULL")
          if not cur.fetchone()[0]:
              sys.exit("::error::audit_logs was destroyed by the negative control cleanup")
          cur.execute("SELECT COUNT(*) FROM pg_trigger WHERE NOT tgisinternal "
                      "AND tgrelid = 'audit_logs'::regclass")
          if cur.fetchone()[0] < 3:
              sys.exit("::error::the append-only triggers did not survive the gate")
          print("Phase 14: audit_logs and its three guard triggers survived the gate.")
          cur.close()
          admin.close()
          PY

