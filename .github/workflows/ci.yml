name: Gerege Enterprise CI & Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-security-audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gerege
          POSTGRES_PASSWORD: ci_pg_password_2026
          POSTGRES_DB: gerege_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gerege -d gerege_crm_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      ADMIN_PASSWORD: "ci_test_admin_password_2026"
      GEMINI_MODEL: "gemini-3.5-flash-lite"
      # SEC-01/B-02: explicit CORS allowlist. Production must set this; there is no
      # wildcard fallback when credentials are enabled.
      ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system Postgres client & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile & Syntax Verification
        run: |
          python -m py_compile main.py database.py agent.py worker.py fintech_service.py cargo_service.py appointment_service.py retention_service.py executive_bot_service.py sheets_service.py core/security.py core/db_engine.py core/models.py core/task_queue.py core/backup_service.py core/ai_router.py core/monitoring.py core/serialization.py routers/system_router.py routers/automation_router.py scripts/migrate_sqlite_to_postgres.py tests/test_p0_security_role_escalation.py tests/test_postgres_restore_real_rollback.py tests/test_p0_connection_pool_leak.py tests/test_p1_payment_security.py tests/test_noflow_features.py tests/test_stage_b_regressions.py core/schema_manager.py migrations/env.py migrations/versions/0002_schema_authority.py migrations/_schema_targets.py migrations/sqlite_compat.py scripts/migrate.py tests/test_stage_c_schema.py

      - name: Dependency Vulnerability Audit
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Initialize SQLite schema & verify zero schema drift
        run: |
          # `init_db()` now builds the schema by running the migrations, so this also
          # proves the migration itself produces a schema identical to core/models.py.
          python -c "import database; database.init_db()"
          python - <<'PY'
          import sys
          from core.schema_manager import compare_with_models, current_revision, drift_report, head_revision

          report = drift_report()
          print("revision:", current_revision(), "head:", head_revision())
          print("drift:", report)
          problems = []
          if current_revision() != head_revision():
              problems.append(f"not at head: {current_revision()} != {head_revision()}")
          if report["has_drift"]:
              problems.append(f"drift: {report['by_kind']}")
              for diff in compare_with_models()[:10]:
                  print("  DIFF:", diff)
          if problems:
              print("FAILED:", "; ".join(problems))
              sys.exit(1)
          print("schema drift: 0 diffs, at head", report["head_revision"])
          PY

      - name: Migration integrity (0001 -> 0002 -> 0001 -> 0002, data preserved)
        run: |
          python scripts/verify_migration_0002.py

      - name: Run Stage C schema authority suite (SQLite)
        run: |
          python -c "import sys, sqlalchemy, alembic; print(sys.version); print('sqlalchemy', sqlalchemy.__version__, '| alembic', alembic.__version__)"
          python -c "import database; print('DB_PATH =', database.DB_PATH)"
          pytest tests/test_stage_c_schema.py -v --tb=short -p no:cacheprovider

      - name: Verify rate limits are shared across workers (SEC-07, live Redis)
        run: |
          # The rest of the SQLite-mode suite runs without REDIS_URL, so the two
          # shared-store assertions skip there. This step is the one that actually proves
          # the guarantee: two separate interpreter processes against one Redis.
          REDIS_URL="redis://127.0.0.1:6379/0" pytest tests/test_sec_07_rate_limits.py -v --tb=short

      - name: Run E-02 trusted-proxy & login rate-limit suite (SQLite + live Redis)
        if: ${{ !cancelled() }}
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
        run: |
          # These files were previously absent from the workflow, so their assertions never
          # ran in CI. E-02 Phase 4 is complete, so the *whole* login rate-limit file runs
          # here now - the `-k` subset that used to exclude test_11/test_11b/test_12 is gone
          # because those tests pass. The "|| true" is deliberately NOT used: a failure here
          # must fail the build.
          pytest tests/test_e02_trusted_proxy.py -v --tb=short
          pytest tests/test_e02_login_rate_limit.py -v --tb=short

          # E-02 Phase 4: account-level failed-login protection.
          #
          # This runs against the live Redis service defined at the top of this file, which
          # matters: three of these tests (multi-process shared counter, counter survives a
          # restart, TTL is bounded) SKIP without REDIS_URL. Skipping is not passing, so the
          # step asserts they were actually collected and executed rather than relying on a
          # green tick that could come from skips. The grep fails the build if the summary
          # shows any skip.
          set -o pipefail
          pytest tests/test_e02_phase4_account_protection.py -v --tb=short | tee /tmp/p4.log
          if grep -qE "[0-9]+ skipped" /tmp/p4.log; then
            echo "::error::E-02 Phase 4 tests skipped; REDIS_URL must be live for these to run"
            exit 1
          fi

          # E-02 Phase 4.1: hardening of the account throttle.
          #
          #   A. canonical identity (username and page_id share one budget)
          #   B. atomic INCR + EXPIRE via Lua
          #   C. refund-on-success instead of whole-key reset
          #   D. production refuses to start without E02_ACCOUNT_KEY_SECRET
          #   E. normalization follows the database, not Python's casefold
          #
          # One skip is EXPECTED and legitimate here: test_141 skips on SQLite because
          # SQLite's LOWER() does not fold Ø/ø, so there is no variant to compare. That is
          # the engine difference the test exists to document, and it does not run on
          # SQLite. The guard below is therefore narrower than Phase 4's: it requires the
          # three shared-store tests to have run (their names must appear as PASSED), rather
          # than forbidding skips outright, and it fails if any *unexpected* skip appears.
          pytest tests/test_e02_phase41_hardening.py -v --tb=short | tee /tmp/p41.log
          for t in test_113_first_increment_sets_a_ttl \
                   test_114_subsequent_increments_preserve_the_window \
                   test_115_increment_and_ttl_are_one_atomic_operation \
                   test_118_concurrent_increments_lose_nothing; do
            if ! grep -q "$t .*PASSED" /tmp/p41.log; then
              echo "::error::E-02 Phase 4.1: $t did not pass; REDIS_URL must be live"
              exit 1
            fi
          done
          unexpected=$(grep -E "SKIPPED" /tmp/p41.log | grep -v "test_141_unicode_variants" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::E-02 Phase 4.1 had an unexpected skip:"
            echo "$unexpected"
            exit 1
          fi

      - name: E-02 Phase 4.2 — admission ownership & window-bound refunds
        if: ${{ !cancelled() }}
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          E02_ACCOUNT_KEY_SECRET: "ci-phase42-account-key-secret-0123456789ab"
        run: |
          # E-02 Phase 4.2: a success refunds only the exact admission it consumed.
          #
          # The reported race: A admitted in W1 -> W1 expires -> B admitted and fails in W2 ->
          # A succeeds and refunds -> B's failure must survive. Reproduced on both backends
          # before the fix (docs/audit/evidence/e02_phase42_before.txt).
          #
          # Unlike Phase 4.1, NO skip is legitimate in this file: every case runs on both
          # backends when REDIS_URL is live, so any skip means the Redis-backed half of the
          # audit did not execute and the job must fail rather than report a pass.
          pytest tests/test_e02_phase42_admission_ownership.py -v --tb=short | tee /tmp/p42.log
          if grep -qE "SKIPPED" /tmp/p42.log; then
            echo "::error::E-02 Phase 4.2 skipped a case; every case must run with REDIS_URL live:"
            grep -E "SKIPPED" /tmp/p42.log
            exit 1
          fi
          for t in test_202_refund_from_an_expired_generation_does_not_touch_the_new_window \
                   test_209_redis_refund_from_an_expired_generation_is_refused \
                   test_214_both_stores_agree_on_the_stale_refund_decision \
                   test_204_a_token_cannot_be_refunded_twice; do
            if ! grep -q "$t .*PASSED" /tmp/p42.log; then
              echo "::error::E-02 Phase 4.2: $t did not pass"
              exit 1
            fi
          done

      - name: E-02 Phase 4.3 — memory expiry parity & durable single-use refunds
        if: ${{ !cancelled() }}
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          E02_ACCOUNT_KEY_SECRET: "ci-phase43-account-key-secret-0123456789ab"
        run: |
          # E-02 Phase 4.3. Two defects in the Phase 4.2 store, both reproduced before the fix
          # (docs/audit/evidence/e02_phase43_before.txt):
          #
          #   1. the memory store refunded an admission whose window had expired whenever
          #      nothing had replaced the counter entry, while Redis refused because its TTL
          #      had already deleted the key;
          #   2. claims lived in one process-wide set bounded to 10,000 and evicted with
          #      set.pop(), so unrelated tenants' refunds could evict a live claim and the same
          #      token could be refunded twice.
          #
          # No skip is legitimate here: every case runs on both backends with REDIS_URL live.
          # The Phase 4.2 step above keeps its own guard and is unchanged.
          pytest tests/test_e02_phase43_memory_claim_durability.py -v --tb=short | tee /tmp/p43.log
          if grep -qE "SKIPPED" /tmp/p43.log; then
            echo "::error::E-02 Phase 4.3 skipped a case; every case must run with REDIS_URL live:"
            grep -E "SKIPPED" /tmp/p43.log
            exit 1
          fi
          for t in test_301_memory_refund_of_an_expired_admission_is_refused \
                   test_303_redis_refunds_of_an_expired_admission_are_refused \
                   test_304_memory_and_redis_agree_when_no_later_window_exists \
                   test_307_a_live_claim_survives_pressure_from_other_accounts \
                   test_313_concurrent_refunds_of_one_token_apply_exactly_once \
                   test_316_token_carries_the_window_it_was_admitted_with; do
            if ! grep -q "$t .*PASSED" /tmp/p43.log; then
              echo "::error::E-02 Phase 4.3: $t did not pass"
              exit 1
            fi
          done

      - name: E-02 Phase 4.4 — window consistency & memory capacity security
        if: ${{ !cancelled() }}
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          E02_ACCOUNT_KEY_SECRET: "ci-phase44-account-key-secret-0123456789ab"
        run: |
          # E-02 Phase 4.4. Two defects in the Phase 4.3 store, both reproduced before the fix
          # (docs/audit/evidence/e02_phase44_before.txt):
          #
          #   1. mixed windows: a counter's window was widened by max() on every admission
          #      while Redis fixes its TTL at creation, so one generation had two lifetimes.
          #      Scenario A: memory refunded a token Redis refused. Scenario B: the SAME token
          #      was refused on memory and accepted on Redis.
          #   2. capacity pressure: _evict_if_needed() dropped the oldest LIVE counter once the
          #      10,000 cap was reached, so filling the store erased any account's failure
          #      budget and handed it a fresh one.
          #
          # No skip is legitimate here: every case runs on both backends with REDIS_URL live.
          pytest tests/test_e02_phase44_window_and_capacity.py -v --tb=short | tee /tmp/p44.log
          if grep -qE "SKIPPED" /tmp/p44.log; then
            echo "::error::E-02 Phase 4.4 skipped a case; every case must run with REDIS_URL live:"
            grep -E "SKIPPED" /tmp/p44.log
            exit 1
          fi
          # "Did not execute" must fail as loudly as "did not pass": require the exact collected
          # count, so a renamed, deselected or silently dropped test cannot pass this guard.
          collected=$(grep -oE "[0-9]+ passed" /tmp/p44.log | head -1 | grep -oE "[0-9]+")
          if [ "$collected" != "17" ]; then
            echo "::error::E-02 Phase 4.4 expected 17 passing cases, saw ${collected:-none}"
            exit 1
          fi
          for t in test_401_a_later_longer_window_does_not_extend_the_generation \
                   test_402_scenario_a_refunds_agree_across_backends \
                   test_403_a_later_shorter_window_does_not_shorten_the_generation \
                   test_404_scenario_b_refunds_agree_across_backends \
                   test_405_the_token_reports_the_generations_effective_expiry \
                   test_409_a_live_victim_counter_survives_capacity_pressure \
                   test_410_no_token_is_issued_when_capacity_blocks_a_safe_admission \
                   test_411_expired_entries_are_reclaimed_so_capacity_becomes_usable \
                   test_415_the_victim_survives_at_any_insertion_order; do
            if ! grep -q "$t .*PASSED" /tmp/p44.log; then
              echo "::error::E-02 Phase 4.4: $t did not pass"
              exit 1
            fi
          done
          # The Redis-backed path must actually have run: these two cannot pass without it.
          for t in test_402_scenario_a_refunds_agree_across_backends \
                   test_404_scenario_b_refunds_agree_across_backends; do
            grep -q "$t .*PASSED" /tmp/p44.log || {
              echo "::error::E-02 Phase 4.4: the Redis-backed parity path did not execute ($t)"
              exit 1
            }
          done

      - name: E-02 Phase 6 — R14/R11/R10/R15 remediation security
        if: ${{ !cancelled() }}
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          E02_ACCOUNT_KEY_SECRET: "ci-phase6-account-key-secret-0123456789abc"
        run: |
          # E-02 Phase 6. Remediation of the four Phase 5 findings, each reproduced before the
          # fix (docs/audit/evidence/e02_phase6_before.txt) and each pinned by a test that was
          # verified to FAIL against the pre-fix implementation:
          #
          #   R14 account limiter failed OPEN on a generic store error (allowed=True)
          #   R11 production could silently run a per-process counter (limit x workers)
          #   R10 set_client_credentials could overwrite another tenant's credentials
          #   R15 get_account_failure_count reported stale counts for non-default windows
          #
          # REDIS_URL is live here on purpose: the R11 cases need a real shared store, and the
          # R15 parity case needs both backends.
          pytest tests/test_e02_phase6_remediation.py -v --tb=short | tee /tmp/p6.log
          # Skips are legitimate ONLY for the Redis-dependent cases, which cannot run without
          # REDIS_URL — and it is set above, so in CI none may skip.
          if grep -qE "SKIPPED" /tmp/p6.log; then
            echo "::error::E-02 Phase 6 skipped a case; every case must run with REDIS_URL live:"
            grep -E "SKIPPED" /tmp/p6.log
            exit 1
          fi
          collected=$(grep -oE "[0-9]+ passed" /tmp/p6.log | head -1 | grep -oE "[0-9]+")
          if [ "$collected" != "60" ]; then
            echo "::error::E-02 Phase 6 expected 60 passing cases, saw ${collected:-none}"
            exit 1
          fi
          # The four findings, one named test each, so a rename or deletion cannot pass silently.
          for t in test_601_account_store_generic_exception_fails_closed \
                   test_620_production_without_redis_url_refuses_to_start \
                   test_650_tenant_b_cannot_take_tenant_a_username \
                   test_670_custom_window_stops_reporting_once_expired; do
            grep -q "$t .*PASSED" /tmp/p6.log || {
              echo "::error::E-02 Phase 6: $t did not pass"
              exit 1
            }
          done
          # The store-failure HTTP path and the readiness/parity paths cannot pass without the
          # real store, so they double as proof that the Redis-backed branches executed.
          for t in test_606_store_failure_refuses_the_http_login \
                   test_625_healthy_production_redis_starts \
                   test_641_readiness_healthy_with_redis_in_production \
                   test_678_redis_and_memory_agree_on_expiry; do
            grep -q "$t .*PASSED" /tmp/p6.log || {
              echo "::error::E-02 Phase 6: the Redis-backed path did not execute ($t)"
              exit 1
            }
          done

      - name: Run Pytest Regression, Enterprise, AI Eval & Failure Suites (SQLite mode)
        run: |
          pytest tests/test_p0_security_role_escalation.py tests/test_p0_connection_pool_leak.py tests/test_p1_payment_security.py tests/test_noflow_features.py tests/test_postgres_cursor_regression.py tests/test_migration_and_restore_verification.py tests/test_enterprise_phases.py tests/test_ai_eval_suite.py tests/test_failure_scenarios.py tests/test_stage_b_regressions.py tests/test_p1_06_foreign_keys.py tests/test_sec_04_webhook_dedup.py tests/test_sec_03_security_headers.py tests/test_sec_07_rate_limits.py tests/test_e01_tenant_isolation.py -v

      - name: Run SQLite-to-PostgreSQL Dry-Run Verification
        if: ${{ !cancelled() }}
        run: |
          python scripts/migrate_sqlite_to_postgres.py --dry-run

      - name: Verify Postgres Connectivity & Drivers
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U gerege -d gerege_crm_test
          python -c "import alembic, psycopg2, sqlalchemy; print('DRIVERS_OK')"

      - name: Verify SQLAlchemy Postgres Engine Connection
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python -c "from core.db_engine import create_sqlalchemy_engine; e = create_sqlalchemy_engine(); c = e.connect(); c.close(); print('PG_ENGINE_OK')"

      - name: Run Alembic Migration on PostgreSQL 16
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python -m alembic upgrade head

      - name: E-02 Phase 8 — username uniqueness (R10) on PostgreSQL
        if: ${{ !cancelled() }}
        env:
          # A DEDICATED database, not gerege_crm_test. This suite seeds and deletes rows, and
          # it runs init_db(); doing that to the shared database corrupts the later
          # "SQLite-to-PostgreSQL Migration & Checksum Verification" step, which requires a
          # pristine target — it compares source and target checksums row by row and fails on
          # any target-only row. Measured: running against gerege_crm_test left a seeded page
          # and produced status CONFLICT_DETECTED in that step.
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_phase8_test"
          # Turn a silent SQLite fallback into a hard failure: a "PostgreSQL pass" reported for
          # a run that actually used SQLite is exactly the false evidence this gate exists to stop.
          R10_REQUIRE_POSTGRES: "1"
          E02_ACCOUNT_KEY_SECRET: "ci-phase8-account-key-secret-0123456789abc"
        run: |
          # E-02 Phase 8. Phase 7 confirmed that the Phase 6 409 was only a SEQUENTIAL guard:
          # under genuine concurrency two tenants still both committed the same normalized
          # username (12/12 trials, PostgreSQL 16.2 and SQLite). The remediation is a
          # database-enforced invariant -- a partial UNIQUE index on LOWER(TRIM(client_username))
          # -- so the race is now unrepresentable rather than merely re-checked.
          #
          # These tests must run on PostgreSQL: the SQLite fallback would not prove the
          # concurrency behaviour, hence R10_REQUIRE_POSTGRES=1 above.
          #
          # Fresh database every run, so the run cannot depend on state a previous step left.
          PGPASSWORD="ci_pg_password_2026" createdb -h 127.0.0.1 -p 5432 -U gerege gerege_phase8_test 2>/dev/null || true
          alembic upgrade head

          pytest tests/test_e02_phase8_username_uniqueness.py -v --tb=short | tee /tmp/p8.log

          # No skip is legitimate here. Every case can run against PostgreSQL, and a skip would
          # be the exact silent-coverage-loss the Phase 8 rules forbid.
          if grep -qE "SKIPPED" /tmp/p8.log; then
            echo "::error::E-02 Phase 8 skipped a case; every case must run on PostgreSQL:"
            grep -E "SKIPPED" /tmp/p8.log
            exit 1
          fi

          collected=$(grep -oE "[0-9]+ passed" /tmp/p8.log | head -1 | grep -oE "[0-9]+")
          if [ "${collected:-0}" -lt 33 ]; then
            echo "::error::E-02 Phase 8 expected at least 33 passing cases, saw ${collected:-none}"
            exit 1
          fi

          # Named findings, so a rename or deletion cannot pass silently.
          for t in test_801_the_unique_index_is_installed_and_correct \
                   test_802_the_index_rejects_a_duplicate_normalized_username \
                   test_831_two_tenants_one_username_natural_concurrency \
                   test_836_repeated_races_never_produce_a_duplicate \
                   test_851_preflight_detects_a_fabricated_duplicate \
                   test_856_startup_refuses_a_database_without_the_invariant \
                   test_870_repair_tool_recreates_a_dropped_index \
                   test_872_repair_tool_refuses_to_touch_existing_collisions; do
            grep -q "$t .*PASSED" /tmp/p8.log || {
              echo "::error::E-02 Phase 8: $t did not pass"
              exit 1
            }
          done

          # Independent assertions of the invariant itself -- not a restatement of a test
          # PASS. A suite that passes while the index is absent or wrong-shaped would be
          # worthless; this asks the database directly.
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          import database
          from core import username_uniqueness as uniq
          from core.db_engine import is_postgres

          if not is_postgres():
              sys.exit("::error::Phase 8 gate is not running on PostgreSQL")

          conn = database.get_connection()
          try:
              if not uniq.index_is_correct(conn):
                  sys.exit("::error::the uniqueness invariant is not in force: "
                           + repr(uniq.describe_index(conn)))
              dupes = uniq.find_duplicate_usernames(conn)
              if dupes:
                  sys.exit("::error::duplicate normalized usernames exist: "
                           + uniq.duplicate_report_text(dupes))
          finally:
              conn.close()

          # The application must refuse to serve without the invariant, and must boot with it.
          from core.schema_manager import assert_security_invariants
          assert_security_invariants()
          print("Phase 8: index shape verified on PostgreSQL, no duplicates, startup guard satisfied.")
          PY

      - name: E-02 Phase 10 — cross-column login identity (R16) on PostgreSQL
        if: ${{ !cancelled() }}
        env:
          # Dedicated database for the same reason as the Phase 8 step: this suite seeds and
          # deletes rows and runs init_db(), which corrupts the checksum-verification step
          # that requires a pristine target.
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_phase10_test"
          # A "PostgreSQL pass" reported for a run that used SQLite is exactly the false
          # evidence this gate exists to stop.
          R10_REQUIRE_POSTGRES: "1"
          E02_ACCOUNT_KEY_SECRET: "ci-phase10-account-key-secret-0123456789ab"
        run: |
          # E-02 Phase 10. Login resolves
          #   LOWER(TRIM(client_username)) = ? OR LOWER(TRIM(page_id)) = ?
          # so one identifier can be claimed through either column. The Phase 8 index covers
          # one column, so it cannot see a username equal to another row's page_id, nor two
          # page_ids differing only by case. Revision 0006 closes both with a projection whose
