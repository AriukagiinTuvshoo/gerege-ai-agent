          python scripts/check_pytest_log.py /tmp/p28suite.log --min-passed 62 --require-summary

      # Phase 29: the backup-security suites below were green but never executed by CI -
      # 227 tests across 16 files, including alerting, offsite integrity and restore
      # verification. That is the gap this step closes.
      #
      # Two of those files skip most of their cases unless a live S3 endpoint is present
      # (`BACKUP_OFFSITE_TEST_ENDPOINT`). Here there is none, so 34 cases skip by design and
      # a floor of 227 would be a lie about what ran. The floor is set to what actually runs
      # in this environment (measured: 184 passing), and the skips are permitted because
      # they carry their own reason in the test. Running the offsite integration against a
      # real S3 service is reported as a known gap rather than papered over with a number.
      - name: Phase 22/23/24 — backup security, alerting, offsite integrity, restore
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pytest tests/test_e07_phase22_alerting.py tests/test_e07_phase22_backup_policy.py \
                 tests/test_e07_phase22_offsite_integrity.py \
                 tests/test_e07_phase22_aead_binding.py \
                 tests/test_e07_phase22_connection_bounds.py \
                 tests/test_e07_phase22_db_bounds.py \
                 tests/test_e07_phase22_offsite_pagination.py \
                 tests/test_e07_phase22_offsite_status.py \
                 tests/test_e07_phase22_recovery_safety.py \
                 tests/test_e07_phase22_retention_plaintext.py \
