          AUDIT=$(psql -h 127.0.0.1 -U gerege -d gerege_e05_p18_test -tAc "SELECT count(*) FROM audit_logs")
          TRIGGERS=$(psql -h 127.0.0.1 -U gerege -d gerege_e05_p18_test -tAc \
            "SELECT count(*) FROM pg_trigger WHERE tgname LIKE 'audit_logs_%' AND tgenabled='O'")
          test "$PAGES" = "2"   || { echo "::error::Phase 18 restored $PAGES pages, expected 2"; exit 1; }
          test "$AUDIT" = "1"   || { echo "::error::Phase 18 restored $AUDIT audit rows, expected 1"; exit 1; }
          test "$TRIGGERS" = "3" || { echo "::error::Phase 18 restored $TRIGGERS audit triggers, expected 3"; exit 1; }
          python scripts/provision_roles.py --verify

