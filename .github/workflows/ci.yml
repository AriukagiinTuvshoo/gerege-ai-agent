                       "bootstrap-owned relation (HIGH-01 is back)")
          print("Phase 16: --verify refused a bootstrap-owned relation. Control OK.")

          admin = psycopg2.connect(DB); admin.autocommit = True
          cur = admin.cursor()
          cur.execute("ALTER TABLE appointments OWNER TO gerege_owner")
          admin.close()
          if provision_roles.main(["--verify"]) != 0:
              sys.exit("::error::--verify did not recover after repair")
          print("Phase 16: --verify recovered after repair.")
          PY

          # Negative control 2: out-of-band UPDATE/DELETE on audit_logs MUST fail
