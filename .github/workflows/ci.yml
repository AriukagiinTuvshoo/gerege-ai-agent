          python scripts/check_pytest_log.py /tmp/p27suite.log --min-passed 35 --require-summary

      # Phase 28: address-level destination policy, DNS-rebinding scope, temp-file
      # lifecycle. The classifier table is the core assertion - it covers the three values
      # where the obvious ipaddress check gives the wrong answer (multicast x2, IPv4-mapped
      # loopback). The temp tests exercise the shipped cleanup function, extracted from
      # api/index.py rather than reimplemented, and the TLS test would fail on a loosened
      # verification step. No database, no network egress.
      - name: Phase 28 — SSRF address policy, rebinding scope, temp-dir lifecycle
        if: ${{ !cancelled() }}
