          INSERT INTO pages (page_id,name,category,is_active,knowledge_json,ai_provider,monthly_token_limit,tokens_used,ebarimt_enabled,daily_report_enabled)
          VALUES ('P18A','TenantA','retail',1,'{}','gemini',1000,0,1,0),
                 ('P18B','TenantB','service',1,'{}','gemini',1000,0,0,0);
          INSERT INTO registrations (page_id,name,phone,service,channel,status,created_at)
          VALUES ('P18A','Alice','99001122','demo','web','new',now());
          INSERT INTO invoices (invoice_id,page_id,amount,currency,status,created_at)
          VALUES ('INV-P18','P18A',15000,'MNT','paid',now());
          INSERT INTO audit_logs (page_id,actor_role,actor_id,action,resource_type,resource_id,details_json,created_at)
          VALUES ('P18A','admin','u1','payment.confirmed','invoice','INV-P18','{}',now());
          SQL

          # 1. Encrypted backup through the shipped scheduled entry point.
          python scripts/maintenance.py backup-run --label ci

          ENC=$(ls /tmp/p18backups/*.enc | head -1)
          ARCHIVE=$(basename "$ENC")

          # 2. The archive must be authenticated, 0600, and accompanied by a checksum
          #    of the CIPHERTEXT (Phase 17 had the sidecar hashing the deleted plaintext).
          test "$(stat -c '%a' "$ENC")" = "600"
          ( cd /tmp/p18backups && sha256sum -c "$ARCHIVE.sha256" )
          if ls /tmp/p18backups/*.sql.gz >/dev/null 2>&1; then
            echo "::error::Phase 18 left a PLAINTEXT dump in the backup directory"
            ls -la /tmp/p18backups
            exit 1
