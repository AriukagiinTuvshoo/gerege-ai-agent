      # ---------------------------------------------------------------------
      - name: Phase 18 — backup lifecycle, authenticated encryption, restore, rollback
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_e05_p18_test"
          DATABASE_OWNER_URL: "postgresql://gerege_owner:ci_owner_password_2026@127.0.0.1:5432/gerege_e05_p18_test"
