            }
          done

          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, ".")
          import psycopg2
          from core import db_privileges

          DB = os.environ["DATABASE_URL"]
          base = DB.rsplit("/", 1)[0]
          _norm = lambda u: (u.replace("postgresql+psycopg2://", "postgresql://", 1)
                              .replace("postgresql+psycopg://", "postgresql://", 1))
          # Connected to the TARGET database, not /postgres: roles are cluster-wide so
          # CREATE ROLE works from anywhere, but `ALTER TABLE audit_logs` is per-database
          # and silently targeted the wrong one in the first version of this gate.
          admin = psycopg2.connect(_norm(DB))
          admin.autocommit = True
          cur = admin.cursor()
          # The provisioning script must reach least privilege from scratch, and its own
          # verify must agree — a gate that only ran pytest could pass with a script that
          # provisions nothing.
          os.environ["ADMIN_DATABASE_URL"] = DB
          os.environ["GEREGE_OWNER_PASSWORD"] = "ci_owner_pw_2026"
          os.environ["GEREGE_APP_PASSWORD"] = "ci_app_pw_2026"
          from scripts import provision_roles

          if provision_roles.main(["--apply"]) != 0:
