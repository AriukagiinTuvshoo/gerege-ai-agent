          # a fix applied to one and not the other.
          #
          # `-e` is used rather than `--env-file`: Caddy interpolates {$VAR} from the
          # container's process environment, and an explicit `-e NAME=value` cannot be
          # silently mis-parsed (an env-file with a stray quote or a stray CR would leave
          # the variable empty and Caddy would then validate an EMPTY site address — which
          # parses fine, so the gate would pass while checking nothing). `-e` also keeps the
          # two variables visibly bound to the file that needs them.
          fail=0
          validate_one() {
            file="$1"; var="$2"
            echo "--- caddy validate: $file (set \$$var) ---"
            if docker run --rm \
                 -e "$var=ci-validate.example.mn" \
                 -e "ACME_EMAIL=ci@example.mn" \
                 -e "DOMAIN=ci-validate.example.mn" \
                 -v "$PWD/$file:/etc/caddy/Caddyfile:ro" \
                 caddy:2.8-alpine \
                 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "OK: $file parses"
            else
              echo "::error title=Caddyfile invalid::$file does not parse"
              fail=1
            fi
          }
          validate_one deploy/Caddyfile STAGING_DOMAIN
          validate_one deploy/Caddyfile.prod PRODUCTION_DOMAIN
          # Negative control, so this gate is proven able to fail. Measured against
          # caddy:2.8-alpine during Phase 38:
          #
          #   duplicate `format json` in one log block  -> exit 0  ACCEPTED
          #   `reverse_proxy` with no upstream          -> exit 0  ACCEPTED
          #   empty `header` block                      -> exit 0  ACCEPTED
          #   unknown directive                         -> exit 1  rejected
          #   unclosed brace                            -> exit 1  rejected
          #   arbitrary non-Caddyfile text              -> exit 1  rejected
          #
          # The duplicate-`format` case was used here first and is INVALID as a control:
          # Caddy accepts it, so the control fired on every run and failed CI on a correct
          # Caddyfile. It also means Phase 37's F-37-1 was described wrongly — the docs say
          # repeating a subdirective "is an error", but the binary does not reject it.
          # An unknown directive is a real parse failure and is what this asserts.
          printf '%s\n' '{$DOMAIN} {' '\tnot_a_real_directive foo' '\treverse_proxy web:8000' '}' > /tmp/Caddyfile.bad
          set +e
          docker run --rm \
               -e DOMAIN=ci-validate.example.mn \
               -v /tmp/Caddyfile.bad:/etc/caddy/Caddyfile:ro \
               caddy:2.8-alpine \
               caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile > /tmp/bad.log 2>&1
          bad_status=$?
          set -e
          sed -n '1,20p' /tmp/bad.log
          if [ "$bad_status" -eq 0 ]; then
            echo "::error title=validator is broken::caddy accepted an invalid Caddyfile"
            exit 1
          fi
          if ! grep -qi "unrecognized directive" /tmp/bad.log; then
            echo "::error title=validator is broken::rejected without naming the directive"
            exit 1
          fi
          echo "OK: the validator rejects an unknown directive (exit $bad_status)"
          exit "$fail"

      - name: Validate the Caddyfile structure (Phase 37)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # NOT a substitute for `caddy validate`, which needs the Caddy binary and remains
          # a staging gate. This catches the specific class of error that shipped in Phase
          # 36: a repeated `log` subdirective (a hard Caddyfile error that stops the proxy
          # from starting) and a `header` block that overwrites the application's values
          # without `defer`. Both are stated rules in Caddy's own directive documentation.
          python scripts/check_caddyfile.py

      - name: Report pinned base-image digests (advisory, never fails the build)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          # Phase 37. The Dockerfile's base image is a mutable tag because a digest cannot
          # be resolved from the audit environment (Docker Hub is outside its egress
          # allowlist). This step resolves the real digests on a runner that *can* reach
          # the registry, and prints them ready to paste.
          #
          # It is advisory on purpose:
          #   * `continue-on-error: true` means a registry outage cannot turn a green
          #     pipeline red for a cosmetic reason;
          #   * it never writes to the Dockerfile, so it cannot introduce a digest that
          #     later becomes unpullable (which is exactly how an earlier placeholder
          #     broke the image build).
          #
          # Copy the value for `python:3.12-slim` into ARG BASE_IMAGE (or pass it as
          # --build-arg) to close the last reproducibility gap.
          set -uo pipefail
          for image in python:3.12-slim caddy:2.8-alpine postgres:16-alpine redis:7-alpine; do
            digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "${digest}" ]; then
              echo "::notice title=digest ${image}::${image}@${digest}"
              echo "PIN ${image}@${digest}"
            else
              echo "::warning title=digest unavailable::could not resolve a digest for ${image}"
            fi
          done
          # Deliberately no `exit 1`: advisory.
          exit 0
