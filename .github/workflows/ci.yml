          import os, sys
          sys.path.insert(0, ".")
          import psycopg2

          DB = os.environ["DATABASE_URL"].replace("postgresql+psycopg2://", "postgresql://", 1)
          admin = psycopg2.connect(DB); admin.autocommit = True
          cur = admin.cursor()
          cur.execute("ALTER TABLE appointments OWNER TO gerege")
          admin.close()

