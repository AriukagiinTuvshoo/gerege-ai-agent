name: Gerege Enterprise CI & Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-security-audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gerege
          POSTGRES_PASSWORD: ci_pg_password_2026
          POSTGRES_DB: gerege_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gerege -d gerege_crm_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      ADMIN_PASSWORD: "ci_test_admin_password_2026"
      GEMINI_MODEL: "gemini-3.5-flash-lite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system Postgres client & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile & Syntax Verification
        run: |
          python -m py_compile main.py database.py agent.py worker.py fintech_service.py cargo_service.py appointment_service.py retention_service.py executive_bot_service.py sheets_service.py core/security.py core/db_engine.py core/models.py core/task_queue.py core/backup_service.py core/ai_router.py core/monitoring.py routers/system_router.py scripts/migrate_sqlite_to_postgres.py

      - name: Initialize SQLite schema & verify zero schema drift
        run: |
          python -c "import database; database.init_db(); from core import models, db_engine; engine = db_engine.create_sqlalchemy_engine('sqlite:///:memory:'); models.Base.metadata.create_all(bind=engine); drift = db_engine.verify_schema_drift(); assert not drift['has_drift'], drift"

      - name: Run Pytest Regression, Enterprise, AI Eval & Failure Suites (SQLite mode)
        run: |
          pytest tests/test_postgres_cursor_regression.py tests/test_migration_and_restore_verification.py tests/test_enterprise_phases.py tests/test_ai_eval_suite.py tests/test_failure_scenarios.py -v

      - name: Run SQLite-to-PostgreSQL Dry-Run Verification
        run: |
          python scripts/migrate_sqlite_to_postgres.py --dry-run

      - name: Verify Postgres Connectivity & Drivers
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U gerege -d gerege_crm_test
          python -c "import alembic, psycopg2, sqlalchemy; print('DRIVERS_OK')"

      - name: Verify SQLAlchemy Postgres Engine Connection
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python -c "from core.db_engine import create_sqlalchemy_engine; e = create_sqlalchemy_engine(); c = e.connect(); c.close(); print('PG_ENGINE_OK')"

      - name: Run Alembic Migration on PostgreSQL 16
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python -m alembic upgrade head

      - name: Run SQLite-to-PostgreSQL Migration & Checksum Verification
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python scripts/migrate_sqlite_to_postgres.py --postgres-url "$DATABASE_URL"

      - name: Run PostgreSQL Cursor Regression Suite (Live PostgreSQL 16)
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          pytest tests/test_postgres_cursor_regression.py -v --tb=short

      - name: Run Migration & SQLite Restore Verification Suite
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          pytest tests/test_migration_and_restore_verification.py -k "not postgres_restore" -v --tb=short

      - name: Diag pg_dump has transaction_timeout or restrict
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python -c "import gzip; from core import backup_service; b = backup_service.create_backup('ci_d4'); txt = gzip.open(b['path'], 'rt', encoding='utf-8', errors='replace').read(); assert 'transaction_timeout' not in txt and '\\\\restrict' not in txt, f'FOUND_KW: tt={\"transaction_timeout\" in txt} rest={\"\\\\restrict\" in txt}'"

      - name: Diag psql without ON_ERROR_STOP on isolated DB
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python -c "import gzip, os, subprocess, tempfile; from core import backup_service; u = os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://'); u_admin = u.rsplit('/', 1)[0] + '/postgres'; subprocess.run(['psql', u_admin, '-c', 'DROP DATABASE IF EXISTS restore_diag2;'], check=True); subprocess.run(['psql', u_admin, '-c', 'CREATE DATABASE restore_diag2;'], check=True); u_diag = u.rsplit('/', 1)[0] + '/restore_diag2'; b = backup_service.create_backup('ci_d5'); f = tempfile.NamedTemporaryFile(suffix='.sql', delete=False); f.write(gzip.open(b['path'], 'rb').read()); f.close(); p = subprocess.run(['psql', '--single-transaction', '-f', f.name, u_diag], capture_output=True); os.unlink(f.name); subprocess.run(['psql', u_admin, '-c', 'DROP DATABASE IF EXISTS restore_diag2;']); assert p.returncode == 0"

      - name: Diag psql without --single-transaction on isolated DB
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          python -c "import gzip, os, subprocess, tempfile; from core import backup_service; u = os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://'); u_admin = u.rsplit('/', 1)[0] + '/postgres'; subprocess.run(['psql', u_admin, '-c', 'DROP DATABASE IF EXISTS restore_diag3;'], check=True); subprocess.run(['psql', u_admin, '-c', 'CREATE DATABASE restore_diag3;'], check=True); u_diag = u.rsplit('/', 1)[0] + '/restore_diag3'; b = backup_service.create_backup('ci_d6'); f = tempfile.NamedTemporaryFile(suffix='.sql', delete=False); f.write(gzip.open(b['path'], 'rb').read()); f.close(); p = subprocess.run(['psql', '-v', 'ON_ERROR_STOP=1', '-f', f.name, u_diag], capture_output=True); os.unlink(f.name); subprocess.run(['psql', u_admin, '-c', 'DROP DATABASE IF EXISTS restore_diag3;']); assert p.returncode == 0"

      - name: Run Live PostgreSQL 16 Restore Good Verification
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          pytest tests/test_migration_and_restore_verification.py -k "postgres_restore_good" -v --tb=short

      - name: Run Live PostgreSQL 16 Restore Bad Rejection
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
        run: |
          pytest tests/test_migration_and_restore_verification.py -k "postgres_restore_bad" -v --tb=short

      - name: Run Enterprise Phases Suite (Live PostgreSQL 16 & Redis 7)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
          REDIS_URL: "redis://127.0.0.1:6379/0"
        run: |
          pytest tests/test_enterprise_phases.py -v --tb=short

      - name: Run AI Eval Suite (Live PostgreSQL 16 & Redis 7)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
          REDIS_URL: "redis://127.0.0.1:6379/0"
        run: |
          pytest tests/test_ai_eval_suite.py -v --tb=short

      - name: Run Failure Scenarios Suite 01-19 (Live PostgreSQL 16 & Redis 7)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
          REDIS_URL: "redis://127.0.0.1:6379/0"
        run: |
          pytest tests/test_failure_scenarios.py -k "not scenario_20" -v --tb=short

      - name: Run Failure Scenario 20 (Live PostgreSQL 16 & Redis 7)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_crm_test"
          REDIS_URL: "redis://127.0.0.1:6379/0"
        run: |
          pytest tests/test_failure_scenarios.py -k "scenario_20" -v --tb=short

      - name: Build Production Docker Image
        if: ${{ !cancelled() }}
        run: |
          docker build -t gerege-ai-agent:ci .
