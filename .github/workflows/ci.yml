      - name: Phase 16 — deploy sequence, ownership convergence, fail-closed verify
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgresql+psycopg2://gerege:ci_pg_password_2026@127.0.0.1:5432/gerege_e05_p16_test"
