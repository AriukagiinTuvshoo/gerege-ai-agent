          import os, sqlalchemy as sa
          from core.models import Base
          from core.schema_manager import compare_with_models
          e = sa.create_engine(os.environ['DATABASE_URL'])
          with e.connect() as c:
              n = c.execute(sa.text(
                  \"select count(*) from information_schema.table_constraints \"
                  \"where constraint_type='FOREIGN KEY' and table_schema='public'\"
              )).scalar()
          expected = sum(len(col.foreign_keys) for t in Base.metadata.tables.values() for col in t.columns)
          print(f'foreign keys in database: {n} (models declare {expected})')
          assert n >= expected, f'expected at least {expected} foreign keys, found {n}'
          diffs = compare_with_models()
          assert not diffs, diffs[:5]
          print('schema still matches models after adding constraints')
