name: Phase 38 negctl diagnostic
on:
  push:
    branches: ["arena/d78ebf88-gerege-ai-agent"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find a genuinely invalid Caddyfile
        continue-on-error: true
        run: |
          set -uo pipefail
          exec > >(tee /tmp/d.txt) 2>&1
          test_one() {
            name="$1"; shift
            printf '%s\n' "$@" > /tmp/t.caddy
            set +e
            docker run --rm -e DOMAIN=x.example.mn -e STAGING_DOMAIN=x.example.mn \
              -v /tmp/t.caddy:/etc/caddy/Caddyfile:ro caddy:2.8-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/tmp/o.log 2>&1
            st=$?
            set -e
            echo "### $name -> exit $st"
            grep -iE "error|unrecognized|unknown|cannot|invalid" /tmp/o.log | head -3
          }
          test_one "duplicate format" '{$DOMAIN} {' '	log {' '		format json' '		format json' '	}' '	reverse_proxy web:8000' '}'
          test_one "unknown directive" '{$DOMAIN} {' '	not_a_real_directive foo' '	reverse_proxy web:8000' '}'
          test_one "unclosed brace" '{$DOMAIN} {' '	reverse_proxy web:8000'
          test_one "bad address" '{$DOMAIN} {' '	reverse_proxy' '}'
          test_one "garbage" 'this is not a caddyfile at all !!!'
          test_one "empty" ''
      - name: Commit
        if: always()
        run: |
          cp /tmp/d.txt p38_neg.txt || true
          git config user.name "diag-bot"; git config user.email "d@e.invalid"
          git add p38_neg.txt; git commit -m "temp: negctl probe" || true
          git push origin HEAD:arena/d78ebf88-gerege-ai-agent || true
