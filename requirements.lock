# Gerege AI Agent — LOCKED production dependency set (hash-verified, CPython 3.12)
#
# Phase 37. All 46 packages in the production closure, pinned to exact versions AND to
# SHA-256 hashes of the CPython 3.12 manylinux wheels that `python:3.12-slim` actually
# installs.
#
# WHY THIS FILE CHANGED IN PHASE 37
# ---------------------------------
# Phase 36 shipped an exact-version lock with no hashes, after a first attempt at hashing
# broke the Docker build. The cause was interpreter mismatch: the hashes had been generated
# on the audit host's CPython 3.11, so every hash described a `cp311` wheel, while the image
# runs 3.12. `pip install --require-hashes` then refused every package and the image could
# not be built at all.
#
# The fix is to resolve for the image's interpreter rather than the host's, which pip can do
# from any machine:
#
#   pip download --no-deps --only-binary=:all: \
#     --python-version 3.12 --implementation cp --abi cp312 \
#     --platform <platform> --dest wheels <the pins below>
#
# A single platform tag is NOT enough, and the reason is subtle. `pip --platform` REPLACES
# the compatible wheel-tag set rather than extending it, so pinning one tag hides wheels
# published only under another. Measured during Phase 37:
#
#   pillow 13.0.0   publishes only manylinux_2_28 (absent from manylinux2014)
#   cffi   2.1.1    publishes only manylinux2014 (absent from manylinux_2_28)
#   cryptography   50.0.2 publishes only manylinux_2_34, and that is the wheel a
#                   bookworm-based image (glibc 2.36) selects
#
# The first attempt hashed only manylinux_2_28/2014 and the install failed on cffi; the
# second omitted 2_34 and would have failed on cryptography inside the real image. Both
# failures were caught by resolving with the full union below.
#
# This file therefore lists the SHA-256 of EVERY cp312-compatible x86_64 manylinux wheel
# published on PyPI for each pin (76 wheels across 46 packages), so whichever tag the build
# host legitimately selects, its digest is present. Verified:
#
#   pip download --require-hashes --no-deps --only-binary=:all: \
#     --python-version 3.12 --implementation cp --abi cp312 \
#     --platform manylinux_2_34_x86_64 \
#     --platform manylinux_2_28_x86_64 \
#     --platform manylinux_2_27_x86_64 \
#     --platform manylinux2014_x86_64 \
#     --platform manylinux_2_17_x86_64 \
#     --dest wheels -r requirements.lock
#   -> all 46 packages resolved, nothing missing
#
# The same command on CPython 3.11 with cp311 abi deliberately FAILS with a hash mismatch,
# which is the intended scoping: these are 3.12 wheels. Install the app on a 3.12
# interpreter, or use requirements.txt for a 3.11 dev shell.

