# Gerege AI Agent — LOCKED production dependency set
#
# Phase 36. Generated from the exact package versions installed in the CI-verified
# environment (1,349 tests passing, CI run 45124631443), then resolved into the full
# transitive closure and downloaded to capture SHA-256 hashes.
#
# Why this file exists: `requirements.txt` uses version ranges (`>=x,<y`) and there was no
# lockfile, so two builds of the same commit could install different code. Phase 35 rated
# that Medium. It is fixed here without upgrading anything — every version below is the
# version that was already installed and already tested.
#
# How it was produced (no new tooling, no poetry/uv/pip-tools):
#   python -m pip download --no-deps --only-binary=:all: --dest wheels <the pins below>
#   sha256 of each wheel
#
# Verify / install:
#   pip install --require-hashes --no-deps -r requirements.lock
#
# `--require-hashes` is what makes this a lockfile rather than a suggestion: pip refuses
# to install a package whose hash does not match, and refuses to resolve anything that is
# not pinned here.
#
# REGENERATING: do not edit by hand. Re-run the two commands above after changing
# requirements.txt, and re-run the full test suite before committing the result.
#
# EXCLUDED ON PURPOSE: setuptools, pip, and the test/CI-only packages
# (pytest, PyYAML, bandit, pip_audit, moto, fakeredis, pgserver, ...). Those are not
# installed by the Dockerfile's production layer; see requirements-dev.txt.

