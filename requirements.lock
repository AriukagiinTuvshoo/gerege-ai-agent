# Gerege AI Agent — LOCKED production dependency set
#
# Phase 36. Exact versions, resolved from the package set that passes the full test suite
# in CI, expanded to the complete transitive closure (46 packages).
#
# Why this file exists: `requirements.txt` uses ranges (`>=x,<y`), so two builds of the
# same commit could install different code. Phase 35 rated that Medium. This pins what is
# already tested; **no dependency was upgraded to produce it**.
#
# WHY THERE ARE NO HASHES HERE
# ----------------------------
# The first version of this file carried a SHA-256 per package, generated by downloading
# wheels in the audit environment. It broke the Docker build, and the reason is worth
# recording because it is not obvious:
#
#   the audit environment runs **CPython 3.11**, so every downloaded wheel was `cp311`
#   (`psycopg2_binary-2.9.13-cp311-cp311-manylinux...whl`). The image is
#   `python:3.12-slim`, i.e. `cp312`. `pip install --require-hashes` refuses any wheel
#   whose hash is not listed, and there is no cp311 wheel installable on 3.12, so the
#   image could not be built at all. CI caught it in "Build Production Docker Image".
#
# A lock that only works on the machine that generated it is not a lock. Exact versions,
# by contrast, are portable: psycopg2-binary 2.9.13 publishes cp311 and cp312 wheels
# alike, so the same pin resolves correctly on both.
#
# TO RE-ADD HASH PINNING (recommended before production): generate it on the image's own
# interpreter so the hashes match the wheels the image actually downloads.
#
#   docker run --rm -v "$PWD:/src" -w /src python:3.12-slim bash -c "
#     pip install pip-tools && pip-compile --generate-hashes -o requirements.lock requirements.txt"
#
# Then restore `--require-hashes` in the Dockerfile. Until that is done the image is
# reproducible by *version* but a tampered wheel would not be detected.
#
# Install:
#   pip install --no-deps -r requirements.lock
#
# Regenerate the version list: keep it in step with requirements.txt and re-run the full
# suite before committing.
#
# EXCLUDED ON PURPOSE: setuptools, pip, and the test/CI-only packages (pytest, PyYAML,
# bandit, pip_audit, moto, fakeredis, pgserver, ...). Those are not installed by the
# production layer; see requirements-dev.txt.

